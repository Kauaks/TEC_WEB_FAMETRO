    <h2> Envie sua receita! </h2>
<form action="#">
    
    <label for="nome">Nome Completo:</label><br>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email" placeholder="nome@email.com" required><br><br>

    <label for="celular">Número de Celular:</label><br>
    <input type="tel" id="celular" name="celular" placeholder="(00) 00000-0000" required><br><br>

    <label for="texto_receita">Sua Receita:</label><br>
    <textarea id="texto_receita" name="texto_receita" rows="6" placeholder="Digite os ingredientes e o modo de preparo..." required></textarea><br><br>

    <input type="submit" value="Enviar">
    
</form>
